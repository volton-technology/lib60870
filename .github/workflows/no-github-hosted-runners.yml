name: No GitHub-hosted runners

# CI runs only on our self-hosted ARC runners, never on GitHub-hosted ones, on
# principle. This fails any workflow that asks for a hosted label.

on:
  pull_request:
    paths:
      - ".github/**"
      - "scripts/check-no-github-hosted-runners.py"
  push:
    branches:
      - main
    paths:
      - ".github/**"
      - "scripts/check-no-github-hosted-runners.py"

permissions:
  contents: read

jobs:
  check:
    runs-on: volton-arc-production
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - run: python3 scripts/check-no-github-hosted-runners.py
